<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Education AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Ambient Background Light Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="auth-container">
        <div class="auth-box glass-card">
            <div class="auth-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            </div>
            <h1>Welcome Back</h1>
            <p>Login to access your AI Personal Tutor & study workspace</p>

            <form id="loginForm">
                <div>
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="e.g. student@example.com" required>
                </div>

                <div>
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="auth-btn" style="width: 100%; margin-top: 10px;">Sign In to Dashboard →</button>
            </form>

            <p class="switch-text">
                Don't have an account? <a href="register.html">Create Free Account</a>
            </p>
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" class="back-home">← Back to Home Page</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
